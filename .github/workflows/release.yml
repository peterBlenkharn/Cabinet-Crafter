name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build and verify unsigned win-x64 release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Confirm annotated tag belongs to main
        shell: pwsh
        run: |
          $tagRef = "refs/tags/$env:GITHUB_REF_NAME"
          $tagType = (& git cat-file -t $tagRef).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagType -ne "tag") {
            throw "Release tag '$env:GITHUB_REF_NAME' must be an annotated tag."
          }

          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Could not fetch origin/main for release ancestry verification."
          }

          $tagCommit = (& git rev-list -n 1 $tagRef).Trim()
          git merge-base --is-ancestor $tagCommit refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not point to a commit on main."
          }

      - name: Confirm tag matches project and package versions
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath "CabinetCrafter.csproj" -Raw
          $versionPropertyGroup = @($project.Project.PropertyGroup | Where-Object {
            $versionNode = $_.SelectSingleNode("Version")
            $null -ne $versionNode -and -not [string]::IsNullOrWhiteSpace($versionNode.InnerText)
          }) | Select-Object -First 1
          $version = [string]$versionPropertyGroup.SelectSingleNode("Version").InnerText
          $packageVersion = [string](Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match project version '$expectedTag'."
          }
          if ($packageVersion -ne $version) {
            throw "package.json version '$packageVersion' does not match project version '$version'."
          }
          "version=$version" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run contract and release tests
        run: npm run test:ci

      - name: Restore locked desktop dependencies
        run: dotnet restore CabinetCrafter.csproj --runtime win-x64 --locked-mode

      - name: Build staged portable release
        id: prepare
        shell: pwsh
        run: ./tools/build-release.ps1 -NoRestore -SkipArchive

      - name: Run packaged application startup smoke
        shell: pwsh
        run: |
          $executable = Join-Path "${{ steps.prepare.outputs.package_dir }}" "CabinetCrafter.exe"
          foreach ($argument in @("--smoke-test", "--integration-smoke-test")) {
            $smoke = Start-Process -FilePath $executable -ArgumentList $argument -WindowStyle Hidden -PassThru
            if (-not $smoke.WaitForExit(60000)) {
              Stop-Process -Id $smoke.Id -Force
              throw "Packaged startup smoke timed out: $argument"
            }
            if ($smoke.ExitCode -ne 0) {
              throw "Packaged startup smoke failed with exit code $($smoke.ExitCode): $argument"
            }
          }

      - name: Generate SPDX software bill of materials
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ steps.prepare.outputs.package_dir }}
          format: spdx-json
          output-file: artifacts/release/${{ steps.prepare.outputs.package_name }}.spdx.json

      - name: Archive the verified staged release
        id: package
        shell: pwsh
        run: ./tools/build-release.ps1 -NoRestore -SkipPublish

      - name: Hash and verify release assets
        id: sbom
        shell: pwsh
        run: |
          $sbomPath = Join-Path "artifacts/release" "${{ steps.prepare.outputs.package_name }}.spdx.json"
          if (-not (Test-Path -LiteralPath $sbomPath -PathType Leaf)) {
            throw "SBOM was not generated: $sbomPath"
          }
          $sbomChecksumPath = "$sbomPath.sha256"
          $sbomHash = (Get-FileHash -LiteralPath $sbomPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sbomHash  $([System.IO.Path]::GetFileName($sbomPath))" | Out-File -LiteralPath $sbomChecksumPath -Encoding ascii

          foreach ($checksumPath in @("${{ steps.package.outputs.checksum_path }}", $sbomChecksumPath)) {
            $checksumLine = (Get-Content -LiteralPath $checksumPath -Raw).Trim()
            $checksumParts = $checksumLine -split "\s+", 2
            if ($checksumParts.Count -ne 2) {
              throw "Release checksum is malformed: $checksumPath"
            }
            $assetPath = Join-Path (Split-Path -Parent $checksumPath) $checksumParts[1]
            $actualHash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $checksumParts[0].ToLowerInvariant()) {
              throw "Release checksum verification failed: $assetPath"
            }
          }

          "sbom_path=$([System.IO.Path]::GetFullPath($sbomPath))" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sbom_checksum_path=$([System.IO.Path]::GetFullPath($sbomChecksumPath))" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cabinet-crafter-release-${{ github.ref_name }}
          path: |
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.package.outputs.checksum_path }}
            ${{ steps.sbom.outputs.sbom_path }}
            ${{ steps.sbom.outputs.sbom_checksum_path }}
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Approve and publish unsigned win-x64 release
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cabinet-crafter-release-${{ github.ref_name }}
          path: release-assets

      - name: Reverify the publication payload
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="CabinetCrafter-${version}-win-x64"
          expected=(
            "${package}.zip"
            "${package}.zip.sha256"
            "${package}.spdx.json"
            "${package}.spdx.json.sha256"
          )
          expected_list="$(printf '%s\n' "${expected[@]}" | sort)"
          actual_list="$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)"
          if [[ "$actual_list" != "$expected_list" ]]; then
            printf 'Unexpected release payload.\nExpected:\n%s\nActual:\n%s\n' "$expected_list" "$actual_list" >&2
            exit 1
          fi
          (
            cd release-assets
            sha256sum --check "${package}.zip.sha256"
            sha256sum --check "${package}.spdx.json.sha256"
          )

      - name: Publish immutable-ready GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="CabinetCrafter-${version}-win-x64"
          notice="This is an intentionally unsigned portable Windows x64 build. Windows may display Unknown publisher or a Microsoft Defender SmartScreen warning. Download it only from this official GitHub Release and verify the supplied SHA-256 checksum before extraction. To run Cabinet Crafter, choose ${package}.zip rather than GitHub's automatic Source code archives."
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/${package}.zip" \
            "release-assets/${package}.zip.sha256" \
            "release-assets/${package}.spdx.json" \
            "release-assets/${package}.spdx.json.sha256" \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "Cabinet Crafter ${version}" \
            --notes "$notice"
